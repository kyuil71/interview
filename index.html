<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Research Lab.</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />

  <style>
    body {
      font-family: 'Pretendard', sans-serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
      background-color: #ffffff;
      font-size: 16px;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fade-in 0.4s ease-out forwards; }
    .bg-dark-navy { background-color: #0f172a; }
    .bg-quote-gray { background-color: #f8fafc; }
    .border-card { border-color: #f1f5f9; }
    .hero-title { font-size: 13.5vw; line-height: 1.1; }
    @media (min-width: 430px) { .hero-title { font-size: 58px; } }
    .btn-active:active { transform: scale(0.98); transition: all 0.1s; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="module">
    (async function() {
      // --- CONFIG & CONSTANTS ---
      const MODEL_NAME = "gemini-flash-latest";
      const SESSION_KEY_API = "research_lab_api_key_v31";
      const LOCAL_STORAGE_KEY = "research_lab_saved_state_v31";

      // --- PROMPT TEMPLATES ---
      const PROMPTS = {
        GENERATE_PERSONAS: (topic) => `You are a Senior UX/User Researcher with 15 years of experience. 
        Topic: "${topic}". Suggest exactly 10 diverse and highly professional target personas. 
        [GOAL] Create rich, multi-dimensional user profiles that go beyond surface-level stereotypes. 
        [STYLE] Use professional yet clear Korean suitable for design strategy documents. 
        [STRICT FORMATTING RULE] Provide exactly 10 personas in the specified JSON structure.
        - "name": "[인물 특성을 관통하는 전문적인 수식어] ([카테고리]): [구체적 연령/연령대]"
        - "description": "[직업적 전문성, 일상의 리얼리티, 가치관, 디지털 리터러시, 사회적 관계성 및 행동 양식을 포함한 풍부한 맥락 설명 (3-4문장)]"
        - "needs": "[해결하고자 하는 구체적인 기능적/정서적/심리적 요구 사항]"
        Return JSON object: { "personas": [{ "id": "uuid", "name": "Name", "description": "Description", "needs": "Needs" }] }.`,
        
        GENERATE_SURVEYS: (topic, persona) => `You are an Expert UX Interviewer. Topic: "${topic}". Persona: "${persona.name}".
        Suggest exactly 15 in-depth interview questions organized into 3 categories (5 per category). 
        [STYLE] Write in clear, straightforward, and conversational Korean. 
        Return JSON: { "surveys": [{ "id": "uuid", "title": "Category Title", "questions": ["Question 1", "Question 2", "..."] }] }.`,

        GENERATE_INTERVIEW: (topic, persona, questions) => `You are a Virtual User named ${persona.name}. Topic: "${topic}". 
        Context: ${persona.description}. Needs: ${persona.needs}.
        Answer ALL the following questions realistically as this persona:
        ${questions.map((q, i) => `${i+1}. ${q}`).join("\n")}
        [RULE] 각 질문에 대한 답변은 5문장 정도로 매우 상세하게 작성해 주세요. 답변에는 페르소나의 성격이 드러나는 구체적인 일상 에피소드나 과거의 직접적인 경험담을 반드시 포함하여 답변의 현장감과 설득력을 높여주세요. Do NOT use markdown bold (**). Use natural, conversational Korean. 
        [FORMAT] For "keyInsights", use 1) 2) 3) format.
        Return JSON: { "summary": "Full session summary", "qaPairs": [{ "q": "Question Text", "a": "Answer Text" }], "keyInsights": "1) ... \\n 2) ..." }.`,

        GENERATE_FOLLOW_UP: (topic, persona, question) => `You are ${persona.name}. Topic: "${topic}".
        Answer the follow-up question: "${question}" in your persona's tone. 
        [RULE] Easy Korean. No markdown bold (**).
        Return JSON: { "q": "${question}", "a": "Answer" }.`
      };

      // --- GLOBAL STATE ---
      let state = {
        apiKey: sessionStorage.getItem(SESSION_KEY_API) || "", 
        step: -1, 
        maxStepReached: -1, 
        researchTopic: "",
        aiPersonas: [], 
        manualPersonas: [], 
        selectedPersonaId: null,
        aiSurveys: [], 
        manualSurveys: [], 
        selectedQuestionIds: [], 
        history: [], 
        isAnalyzing: false, 
        errorMsg: null
      };

      window.state = state;

      // --- STATE MANAGEMENT ---
      function setState(newState) {
        const prevStep = state.step;
        if (newState.step !== undefined) state.maxStepReached = Math.max(state.maxStepReached, newState.step);
        state = { ...state, ...newState }; 
        window.state = state;
        render(); 
        if (newState.step !== undefined && newState.step !== prevStep) window.scrollTo(0, 0);
      }
      window.setState = setState;

      // --- API CALL WITH EXPONENTIAL BACKOFF ---
      async function callGemini(systemPrompt, userPrompt) {
        setState({ isAnalyzing: true, errorMsg: null });
        const apiKey = state.apiKey || "";
        const maxRetries = 5;
        let retries = 0;

        while (retries < maxRetries) {
          try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${apiKey}`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                contents: [{ parts: [{ text: userPrompt }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] },
                generationConfig: { 
                  responseMimeType: "application/json",
                  temperature: 0.1 
                }
              })
            });

            if (response.ok) {
              const data = await response.json();
              const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
              setState({ isAnalyzing: false });
              return JSON.parse(text);
            }

            if (response.status === 429 || response.status >= 500) {
              throw new Error(`Status ${response.status}`);
            }
            const errorData = await response.json();
            throw new Error(errorData.error?.message || 'API Error');

          } catch (e) {
            retries++;
            if (retries === maxRetries) {
              setState({ isAnalyzing: false, errorMsg: "AI 분석 중 문제가 발생했습니다. 나중에 다시 시도해 주세요." });
              return null;
            }
            const delay = Math.pow(2, retries) * 1000; // 1s, 2s, 4s, 8s, 16s
            await new Promise(resolve => setTimeout(resolve, delay));
          }
        }
      }

      // --- ACTIONS ---
      const Actions = {
        async validateKey() {
          const input = document.getElementById('api-input');
          let keyToUse = input?.value || state.apiKey;
          if (!keyToUse) { showToast("API 키를 입력해 주세요."); return; }
          
          setState({ apiKey: keyToUse, isAnalyzing: true });
          const test = await callGemini("Return JSON: {\"status\":\"OK\"}", "Test Connection");
          if (test) {
            sessionStorage.setItem(SESSION_KEY_API, keyToUse);
            setState({ step: 0 });
          } else {
            sessionStorage.removeItem(SESSION_KEY_API);
            setState({ apiKey: "", errorMsg: "유효하지 않은 API 키입니다." });
          }
        },

        loadFromLocal() {
          const saved = localStorage.getItem(LOCAL_STORAGE_KEY);
          if (saved) {
            try {
              const data = JSON.parse(saved);
              const currentApiKey = state.apiKey;
              setState({ ...data, apiKey: currentApiKey, isAnalyzing: false });
              showToast("이전 프로젝트를 성공적으로 불러왔습니다.");
              return true;
            } catch (e) { console.error("Local load failed", e); }
          }
          showToast("저장된 프로젝트 데이터가 없습니다.");
          return false;
        },

        startNewProject() {
          const currentApiKey = state.apiKey;
          const initialState = {
            step: 1, maxStepReached: -1, researchTopic: "", aiPersonas: [], manualPersonas: [], 
            selectedPersonaId: null, aiSurveys: [], manualSurveys: [], selectedQuestionIds: [], 
            history: [], isAnalyzing: false, errorMsg: null
          };
          setState({ ...initialState, apiKey: currentApiKey });
        },

        async generatePersonas(instruction = "") {
          const userPrompt = instruction ? `Topic: ${state.researchTopic}. Instruction: ${instruction}` : state.researchTopic;
          const res = await callGemini(PROMPTS.GENERATE_PERSONAS(state.researchTopic), userPrompt);
          if (res) setState({ aiPersonas: res.personas, step: 2 });
        },

        addManualPersona() {
          const nameInput = document.getElementById('manual-p-name');
          const descInput = document.getElementById('manual-p-desc');
          const name = nameInput?.value.trim();
          const desc = descInput?.value.trim();
          if (!name) { showToast("이름 또는 제목을 입력해주세요."); return; }
          const newPersona = { id: 'm' + Date.now(), name: name, description: desc || "설명 정보가 없습니다.", needs: desc || "구체적인 니즈 정보가 없습니다." };
          setState({ manualPersonas: [...state.manualPersonas, newPersona] });
          if (nameInput) nameInput.value = '';
          if (descInput) descInput.value = '';
        },

        addManualQuestions() {
          const input = document.getElementById('manual-q-input');
          const v = input?.value;
          if (v) {
            const list = v.split('\n').map(x => x.trim()).filter(x => x);
            const nid = 'm' + Date.now();
            const newSelected = [...state.selectedQuestionIds, ...list.map((_, i) => nid + '-' + i)];
            setState({
              manualSurveys: [...state.manualSurveys, { id: nid, title: '사용자 추가 질문', questions: list }],
              selectedQuestionIds: newSelected
            });
            if (input) input.value = '';
          }
        },

        async generateSurveys() {
          const persona = [...state.aiPersonas, ...state.manualPersonas].find(p => p.id === state.selectedPersonaId);
          const res = await callGemini(PROMPTS.GENERATE_SURVEYS(state.researchTopic, persona), "Generate questions.");
          if (res) setState({ aiSurveys: res.surveys, step: 4 });
        },
        
        async performInterview() {
          const persona = [...state.aiPersonas, ...state.manualPersonas].find(p => p.id === state.selectedPersonaId);
          const allQ = []; [...state.aiSurveys, ...state.manualSurveys].forEach(s => s.questions.forEach((q, idx) => allQ.push({ id: `${s.id}-${idx}`, text: q })));
          const selectedTexts = allQ.filter(q => state.selectedQuestionIds.includes(q.id)).map(q => q.text);
          if (selectedTexts.length === 0) { showToast("질문을 선택해 주세요."); return; }
          const res = await callGemini(PROMPTS.GENERATE_INTERVIEW(state.researchTopic, persona, selectedTexts), "Start interview.");
          if (res) setState({ history: [...state.history, { personaId: persona.id, result: res }], step: 6 });
        },
        
        async askFollowUp() {
          const input = document.getElementById('followup-input');
          const question = input?.value.trim(); if (!question) return;
          const curH = state.history[state.history.length - 1];
          const persona = [...state.aiPersonas, ...state.manualPersonas].find(p => p.id === curH.personaId);
          const res = await callGemini(PROMPTS.GENERATE_FOLLOW_UP(state.researchTopic, persona, question), "Ask follow-up.");
          if (res) { const newH = [...state.history]; newH[newH.length-1].result.qaPairs.push(res); setState({ history: newH }); input.value = ""; }
        }
      };
      window.Actions = Actions;

      // --- CLIPBOARD UTILITY ---
      function copyReportToClipboard() {
        let txt = "==================================================\n   RESEARCH LAB. 분석 리포트\n==================================================\n\n";
        txt += `[1. 리서치 주제]\n- ${state.researchTopic || "설정된 주제 없음"}\n\n`;
        if (state.aiPersonas.length > 0 || state.manualPersonas.length > 0) {
          txt += `[2. 제안된 타겟 리스트]\n`;
          [...state.aiPersonas, ...state.manualPersonas].forEach((p, i) => {
            txt += `${i+1}. ${p.name}\n   - 설명: ${p.description}\n   - 주요니즈: ${p.needs}\n\n`;
          });
        }
        if (state.history.length > 0) {
          txt += `[3. 인터뷰 세션 기록]\n`;
          state.history.forEach((h, idx) => {
            const persona = [...state.aiPersonas, ...state.manualPersonas].find(p => p.id === h.personaId);
            txt += `--- 인터뷰 #${idx+1} (${persona?.name}) ---\n요약: ${h.result.summary}\n`;
            h.result.qaPairs.forEach((qa, qidx) => { txt += `${qidx+1}. Q: ${qa.q}\n   A: ${qa.a}\n`; });
            txt += `인사이트:\n${h.result.keyInsights}\n\n`;
          });
        }
        
        const textArea = document.createElement("textarea");
        textArea.value = txt;
        document.body.appendChild(textArea);
        textArea.select();
        try {
          document.execCommand('copy');
          showToast("리포트가 클립보드에 복사되었습니다.");
        } catch (err) {
          showToast("복사 실패. 다시 시도해 주세요.");
        }
        document.body.removeChild(textArea);
      }
      window.copyReportToClipboard = copyReportToClipboard;

      function showToast(message) {
        const toast = document.createElement("div");
        toast.innerText = message;
        toast.className = "fixed bottom-24 left-1/2 -translate-x-1/2 bg-black/80 text-white px-6 py-3 rounded-full text-sm font-bold z-[10000] animate-fade-in shadow-xl";
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2500);
      }
      window.showToast = showToast;

      function toggleQuestion(id) {
        let newList = [...state.selectedQuestionIds];
        newList = newList.includes(id) ? newList.filter(x => x !== id) : [...newList, id];
        setState({ selectedQuestionIds: newList });
      }
      window.toggleQuestion = toggleQuestion;

      // --- RENDERERS ---
      function renderHeader(title, prevStep) {
        const canGoNext = state.step < state.maxStepReached;
        return `
          <header class="fixed top-0 left-0 right-0 z-50 bg-white border-b border-slate-100 px-6 h-16 flex items-center justify-between max-w-[430px] mx-auto">
            <div class="flex items-center gap-1">
              <button onclick="setState({step: ${prevStep}})" class="p-2 -ml-2 rounded-full hover:bg-slate-50 transition-all"><i data-lucide="chevron-left" class="w-7 h-7 text-slate-500"></i></button>
              ${canGoNext ? `<button onclick="setState({step: ${state.step + 1}})" class="p-2 rounded-full hover:bg-slate-50 text-slate-500 transition-all"><i data-lucide="chevron-right" class="w-7 h-7"></i></button>` : ""}
              <h1 class="font-bold text-base truncate ml-1 font-black">${title}</h1>
            </div>
            <div class="flex items-center gap-1">
              <button onclick="copyReportToClipboard()" class="p-2 rounded-full hover:bg-slate-100 text-slate-500 transition-all"><i data-lucide="copy" class="w-6 h-6"></i></button>
              <button onclick="setState({step: 0})" class="p-2 rounded-full hover:bg-slate-100 text-slate-500 transition-all"><i data-lucide="home" class="w-6 h-6"></i></button>
            </div>
          </header>`;
      }

      function render() {
        const root = document.getElementById('root');
        let content = "";
        
        if (state.isAnalyzing) {
          content = `<div class="fixed inset-0 z-[9999] bg-white/95 backdrop-blur-md flex flex-col items-center justify-center p-8 text-center max-w-[430px] mx-auto animate-fade-in">
              <div class="w-16 h-16 border-4 border-slate-100 border-t-blue-600 rounded-full animate-spin mb-8"></div>
              <p class="text-slate-900 font-normal text-2xl tracking-tighter">AI 분석 중</p>
            </div>`;
        }

        switch (state.step) {
          case -1:
            content += `<div class="min-h-screen flex flex-col items-center justify-center p-10 bg-white text-center animate-fade-in">
                <div class="w-24 h-24 bg-blue-600 rounded-full flex items-center justify-center mb-10 shadow-[0_8px_30px_rgb(37,99,235,0.4)] btn-active"><i data-lucide="fingerprint" class="text-white w-12 h-12"></i></div>
                <div class="w-full px-2 mb-4">
                  <h1 class="hero-title font-black italic tracking-tighter text-slate-900 mb-2">Research Lab.<br/>Be Creative!</h1>
                </div>
                <p class="text-slate-400 font-medium mb-16 text-sm">AI 기반 디자인 리서치 자동화 도구</p>
                
                <div class="w-full">
                  <div class="mb-8">
                    <a href="https://aistudio.google.com/app/apikey" target="_blank" class="text-[#2563EB] font-bold text-[18px] underline underline-offset-4">개인 API Key 발급받기</a>
                  </div>
                  <input type="password" id="api-input" class="w-full h-[62px] bg-white border-2 border-[#CBD5E1] rounded-[1.2rem] text-center focus:ring-2 focus:ring-blue-500 outline-none text-[18px] font-medium mb-5 placeholder:text-slate-400" placeholder="API 입력">
                  <p class="text-[#64748B] font-medium text-[12px] leading-relaxed mb-10 px-4">분석을 위해 유효한 Gemini API 키를 직접 입력해 주세요.<br/>(로컬 브라우저에만 임시 유지됩니다)</p>
                  <button onclick="Actions.validateKey()" class="w-full py-5 bg-[#1e3a8a] text-white rounded-[1.2rem] font-bold text-[20px] shadow-sm btn-active">API Key 입력 후 시작</button>
                </div>
              </div>`;
            break;

          case 0:
            content += `<div class="min-h-screen flex flex-col p-8 bg-dark-navy text-white relative overflow-hidden">
                <div class="flex-1 flex flex-col justify-center space-y-10 animate-fade-in">
                  <div class="inline-block px-4 py-1.5 bg-blue-600 rounded-full text-[12px] font-black tracking-widest uppercase w-fit">Design Researcher AI</div>
                  <h1 class="text-5xl font-black leading-tight tracking-tighter">사용자의<br/>진심을<br/><span class="text-blue-500">발견하세요.</span></h1>
                  <p class="text-slate-400 text-lg leading-relaxed font-medium">디자인 리서치 전 과정을 AI가 돕습니다.<br/>주제 설정부터 인터뷰까지 단숨에 진행하세요.</p>
                </div>
                <div class="space-y-4 pb-10">
                  <button onclick="Actions.loadFromLocal()" class="w-full py-5 bg-slate-800/50 border border-white/20 text-white rounded-2xl font-bold text-xl flex items-center justify-center gap-2 shadow-2xl btn-active">기존 프로젝트 열기 <i data-lucide="folder-open" class="w-5 h-5"></i></button>
                  <button onclick="Actions.startNewProject()" class="w-full py-6 bg-white text-slate-900 rounded-2xl font-black text-xl shadow-2xl flex items-center justify-center gap-2 btn-active">
                    새 프로젝트 시작 <i data-lucide="arrow-right" class="w-6 h-6"></i>
                  </button>
                </div>
              </div>`;
            break;

          case 1:
            content += `<div class="pt-24 px-6 min-h-screen flex flex-col animate-fade-in bg-white">
                ${renderHeader("주제 설정", 0)}
                <div class="mb-10">
                  <h2 class="text-3xl font-black mb-3 tracking-tight leading-tight text-slate-900">어떤 주제로<br/>사용자 리서치를 진행할까요?</h2>
                  <p class="text-slate-400 font-medium text-sm">탐색하고 싶은 과제를 구체적으로 입력해 주세요.</p>
                </div>
                <textarea id="topic-input" class="w-full h-64 p-6 bg-slate-50 border border-slate-100 rounded-[2.5rem] text-xl outline-none placeholder:text-slate-300 font-medium leading-relaxed" placeholder="예: 해외 여행을 계획할 때 스트레스를 느끼는 1인 가구">${state.researchTopic}</textarea>
                <div class="fixed bottom-0 left-0 right-0 p-6 bg-white/95 border-t max-w-[430px] mx-auto z-[60]">
                  <button onclick="const val = document.getElementById('topic-input').value; if(val){ setState({researchTopic: val}); Actions.generatePersonas(); }" class="w-full py-6 bg-slate-900 text-white rounded-2xl font-black text-lg shadow-2xl btn-active">인터뷰 타겟 제안 받기</button>
                </div>
              </div>`;
            break;

          case 2:
            content += `<div class="pt-24 px-6 pb-64 animate-fade-in bg-white">
                ${renderHeader("타겟 제안", 1)}
                <h2 class="text-3xl font-black mb-2 tracking-tight text-slate-900">이런 분들은 어떠신가요?</h2>
                <p class="text-blue-600 text-lg font-bold mb-10">리서치 전문가가 분석한 최적의 타겟 10명입니다.</p>
                <div class="space-y-0 mb-10">
                  ${[...state.aiPersonas, ...state.manualPersonas].map((p, i) => `
                    <div class="py-10 border-b border-slate-100 animate-fade-in last:border-0">
                      <h3 class="font-black text-[22px] text-slate-900 mb-6 leading-snug">${i+1}. ${p.name}</h3>
                      <p class="text-[17px] text-slate-700 font-medium mb-8 leading-relaxed whitespace-pre-line">${p.description}</p>
                      <div class="w-full bg-quote-gray px-5 py-5 rounded-2xl text-[18px] text-slate-600 font-medium italic border border-slate-200/40">
                        <span class="font-black text-slate-900 not-italic">- 주요니즈:</span> " ${p.needs} "
                      </div>
                    </div>`).join('')}
                </div>
                <div class="space-y-6 mb-4 transition-all">
                  <div class="p-5 bg-blue-50/50 border border-blue-100 rounded-3xl space-y-4">
                    <div class="flex items-center justify-between gap-2">
                      <h4 class="text-sm font-black text-blue-600 uppercase tracking-widest flex items-center gap-2">
                        <i data-lucide="sparkles" class="w-4 h-4"></i> 타겟 수정 지시
                      </h4>
                      <button onclick="Actions.generatePersonas(document.getElementById('persona-inst').value)" class="shrink-0 w-11 h-11 bg-blue-600 text-white rounded-xl shadow-lg flex items-center justify-center btn-active">
                        <i data-lucide="send" class="w-5 h-5"></i>
                      </button>
                    </div>
                    <input type="text" id="persona-inst" class="w-full p-4 bg-white border border-blue-100 rounded-2xl text-base outline-none focus:ring-2 focus:ring-blue-500 font-medium" placeholder="예: 소득 수준 낮은 학생 위주">
                  </div>
                  <div class="p-5 bg-slate-50 border border-slate-200/50 rounded-3xl space-y-4">
                    <h4 class="text-sm font-black text-slate-500 uppercase tracking-widest flex items-center gap-2"><i data-lucide="plus" class="w-4 h-4"></i> 직접 타겟 추가</h4>
                    <input type="text" id="manual-p-name" class="w-full p-4 bg-white border border-slate-200 rounded-2xl text-base font-bold outline-none" placeholder="이름 또는 제목">
                    <textarea id="manual-p-desc" class="w-full p-4 bg-white border border-slate-200 rounded-2xl text-base h-32 outline-none resize-none" placeholder="배경 및 니즈 정보"></textarea>
                    <button onclick="Actions.addManualPersona()" class="w-full py-4 bg-dark-navy text-white rounded-2xl font-black text-xl btn-active">리스트에 추가</button>
                  </div>
                </div>
                <div class="fixed bottom-0 left-0 right-0 p-6 bg-white/95 border-t max-w-[430px] mx-auto z-[60]">
                  <button onclick="setState({step: 3})" class="w-full py-6 bg-blue-600 text-white rounded-2xl font-black text-xl shadow-2xl btn-active">인터뷰 대상 선택</button>
                </div>
              </div>`;
            break;

          case 3:
            const selectable = [...state.aiPersonas, ...state.manualPersonas];
            content += `<div class="pt-24 px-6 pb-40 animate-fade-in bg-white">
                ${renderHeader("타겟 선택", 2)}
                <h2 class="text-3xl font-black mb-8 tracking-tight text-slate-900">인터뷰를 진행할<br/>핵심 타겟을 골라주세요</h2>
                <div class="grid gap-5">
                  ${selectable.map((p, i) => {
                    const isDone = state.history.some(h => h.personaId === p.id);
                    const isSel = state.selectedPersonaId === p.id;
                    return `<div onclick="${isDone ? '' : `setState({selectedPersonaId: '${p.id}', aiSurveys: [], manualSurveys: [], selectedQuestionIds: []})`}" class="p-6 rounded-[2.5rem] border-2 transition-all cursor-pointer ${isDone ? 'opacity-40 bg-slate-50 border-slate-100' : (isSel ? 'border-blue-600 bg-blue-50 shadow-lg scale-[1.03]' : 'border-slate-100 bg-white hover:border-slate-200 shadow-sm')}">
                      <div class="flex items-center gap-4 mb-3">
                        <div class="w-10 h-10 rounded-full flex items-center justify-center shrink-0 ${isSel ? 'bg-blue-600 text-white shadow-lg' : 'bg-slate-100 text-slate-400'} font-black text-lg">${i + 1}</div>
                        <h3 class="font-black text-xl text-slate-900">${p.name} ${isDone ? '(완료)' : ''}</h3>
                      </div>
                      <p class="text-base text-slate-600 leading-relaxed font-medium whitespace-pre-line">${p.description}</p>
                    </div>`;
                  }).join('')}
                </div>
                <div class="fixed bottom-0 left-0 right-0 p-6 bg-white border-t max-w-[430px] mx-auto z-[60]">
                  <button onclick="Actions.generateSurveys()" ${!state.selectedPersonaId ? 'disabled' : ''} class="w-full py-6 bg-slate-900 text-white rounded-2xl font-black text-lg btn-active shadow-2xl disabled:opacity-30">인터뷰 질문 제안 받기</button>
                </div>
              </div>`;
            break;

          case 4:
            const combinedSurveys = [...state.aiSurveys, ...state.manualSurveys];
            content += `<div class="pt-24 px-6 pb-64 animate-fade-in bg-white">
                ${renderHeader("질문 설계", 3)}
                <h2 class="text-3xl font-black mb-4 tracking-tight text-slate-900">인터뷰 질문 설계</h2>
                <p class="text-blue-600 text-lg font-bold mb-10">질문들을 개별 선택하여 최적의 인터뷰를 구성하세요.</p>
                <div class="space-y-12 mb-10">
                  ${combinedSurveys.map(s => `
                    <div>
                      <h3 class="font-black text-xl text-slate-900 mb-6 flex items-center gap-3"><div class="w-2.5 h-6 bg-blue-600 rounded-full"></div> ${s.title}</h3>
                      <div class="space-y-4">
                        ${s.questions.map((q, idx) => {
                          const qId = `${s.id}-${idx}`; 
                          const isSel = state.selectedQuestionIds.includes(qId);
                          return `<div onclick="toggleQuestion('${qId}')" class="p-6 rounded-[1.5rem] border-2 transition-all cursor-pointer flex gap-4 ${isSel ? 'border-blue-600 bg-blue-50 shadow-md' : 'border-slate-100 bg-white shadow-sm'}">
                            <div class="w-7 h-7 rounded-full border-2 flex items-center justify-center shrink-0 mt-1 ${isSel ? 'border-blue-600 bg-blue-600' : 'border-slate-200'} text-white">${isSel ? `<i data-lucide="check" class="w-4 h-4"></i>` : ""}</div>
                            <p class="text-base text-slate-800 font-bold flex-1">${q}</p>
                          </div>`;
                        }).join('')}
                      </div>
                    </div>`).join('')}
                </div>
                <div class="p-8 bg-slate-50 border border-slate-100 rounded-[2.5rem] space-y-6 mb-4 shadow-sm">
                  <h4 class="text-sm font-black text-slate-500 uppercase tracking-widest flex items-center gap-2"><i data-lucide="plus" class="w-5 h-5"></i> 직접 질문 추가</h4>
                  <textarea id="manual-q-input" class="w-full p-5 bg-white border border-slate-200 rounded-2xl text-lg h-32 outline-none font-medium" placeholder="엔터로 구분하여 질문을 입력하세요"></textarea>
                  <button onclick="Actions.addManualQuestions()" class="w-full py-5 bg-dark-navy text-white rounded-2xl font-black text-xl btn-active">질문에 추가</button>
                </div>
                <div class="fixed bottom-0 left-0 right-0 p-6 bg-white/95 border-t max-w-[430px] mx-auto z-[60]">
                  <button onclick="if(state.selectedQuestionIds.length > 0) setState({step: 5})" ${state.selectedQuestionIds.length === 0 ? 'disabled' : ''} class="w-full py-6 bg-blue-600 text-white rounded-2xl font-black text-xl shadow-2xl disabled:opacity-30 btn-active">선택 완료 (${state.selectedQuestionIds.length}개)</button>
                </div>
              </div>`;
            break;

          case 5:
            const finalQList = [];
            [...state.aiSurveys, ...state.manualSurveys].forEach(s => s.questions.forEach((q, i) => { if(state.selectedQuestionIds.includes(`${s.id}-${i}`)) finalQList.push(q); }));
            const selectedP = [...state.aiPersonas, ...state.manualPersonas].find(p=>p.id===state.selectedPersonaId);
            content += `<div class="pt-24 px-6 pb-44 animate-fade-in bg-white">
                ${renderHeader("인터뷰 확정", 4)}
                <h2 class="text-3xl font-black mb-10 tracking-tight text-slate-900">최종 확인</h2>
                <div class="bg-dark-navy p-8 rounded-[2.5rem] text-white shadow-2xl mb-12">
                  <div class="mb-8 border-b border-white/10 pb-6"><h3 class="font-black text-2xl leading-tight">${selectedP?.name}</h3></div>
                  <div class="space-y-5 max-h-80 overflow-y-auto pr-2 no-scrollbar font-medium">
                    ${finalQList.map((q, i) => `<div class="flex gap-4 text-base text-slate-300"><span class="font-bold text-blue-400 shrink-0">${i+1}.</span> <p>${q}</p></div>`).join('')}
                  </div>
                </div>
                <div class="fixed bottom-0 left-0 right-0 p-6 bg-white/95 border-t max-w-[430px] mx-auto z-[60]"><button onclick="Actions.performInterview()" class="w-full py-6 bg-blue-600 text-white rounded-2xl font-black text-xl btn-active shadow-2xl">가상 인터뷰 진행하기</button></div>
              </div>`;
            break;

          case 6:
            const curH = state.history[state.history.length-1];
            const curPersona = [...state.aiPersonas, ...state.manualPersonas].find(p => p.id === curH.personaId);
            content += `<div class="pt-24 px-6 pb-80 animate-fade-in bg-white">
                ${renderHeader("인터뷰 결과", 3)}
                <div class="mb-10 p-8 bg-dark-navy rounded-[2.5rem] text-white shadow-2xl">
                    <h2 class="text-2xl font-black mb-4 leading-tight">${curPersona.name}님 리포트</h2>
                    <p class="text-slate-300 text-lg leading-relaxed whitespace-pre-line font-medium">${curH.result.summary}</p>
                </div>
                <div class="space-y-8 mb-16">
                  ${curH.result.qaPairs.map((qa, i) => `
                    <div class="bg-white p-8 rounded-[2rem] border border-slate-100 shadow-sm animate-fade-in">
                      <div class="text-blue-600 font-black text-[11px] uppercase mb-3 tracking-widest flex items-center gap-2">Question</div>
                      <div class="text-slate-900 font-bold text-lg mb-6 leading-relaxed">${i+1}. ${qa.q}</div>
                      <div class="text-slate-400 font-black text-[11px] uppercase mb-3 tracking-widest flex items-center gap-2">Answer</div>
                      <div class="text-slate-700 font-medium text-lg leading-relaxed">${qa.a}</div>
                    </div>`).join('')}
                </div>
                <div class="p-5 bg-blue-50/50 border border-blue-100 rounded-3xl mb-12 space-y-4">
                  <div class="flex items-center justify-between gap-2">
                    <h4 class="text-sm font-black text-blue-600 uppercase tracking-widest flex items-center gap-2">
                      <i data-lucide="sparkles" class="w-4 h-4"></i> 인터뷰 추가 질문
                    </h4>
                    <button onclick="Actions.askFollowUp()" class="shrink-0 w-11 h-11 bg-blue-600 text-white rounded-xl shadow-lg flex items-center justify-center btn-active">
                      <i data-lucide="send" class="w-5 h-5"></i>
                    </button>
                  </div>
                  <input type="text" id="followup-input" class="w-full p-4 bg-white border border-blue-100 rounded-2xl text-base outline-none focus:ring-2 focus:ring-blue-500 font-medium" placeholder="예: 3번 대답의 000에 대해 자세한 설명">
                </div>
                <div class="p-8 bg-blue-50 border border-blue-100 rounded-[2.5rem] mb-12 shadow-inner">
                  <h3 class="text-blue-600 font-black text-sm uppercase tracking-widest mb-6 flex items-center gap-2"><i data-lucide="lightbulb" class="w-6 h-6"></i> Key Insights</h3>
                  <div class="text-slate-800 font-bold text-lg leading-loose whitespace-pre-line">${curH.result.keyInsights}</div>
                </div>
                <div class="fixed bottom-0 left-0 right-0 p-5 bg-white border-t max-w-[430px] mx-auto space-y-3 z-[60]">
                  <button onclick="setState({step: 3})" class="w-full py-5 bg-white border-2 border-blue-600 text-blue-600 rounded-2xl font-black text-lg flex items-center justify-center gap-3 btn-active">
                    <i data-lucide="rotate-ccw" class="w-5 h-5"></i> 다른 타겟 인터뷰하기
                  </button>
                  <button onclick="copyReportToClipboard()" class="w-full py-5 bg-slate-900 text-white rounded-2xl font-black text-lg shadow-xl btn-active">리포트 복사 및 인터뷰 종료</button>
                </div>
              </div>`;
            break;
        }
        
        root.innerHTML = `<div class="w-full max-w-[430px] mx-auto min-h-screen shadow-2xl relative overflow-hidden">${content}</div>`;
        lucide.createIcons();
      }

      // --- BOOTSTRAP ---
      window.onload = () => {
        render();
        // 5초 간격 자동 저장 설정
        setInterval(() => {
          if (state.step > 0) {
            const { apiKey, isAnalyzing, errorMsg, ...dataToSave } = state;
            localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(dataToSave));
          }
        }, 5000);
      };

    })();
  </script>
</body>
</html>
